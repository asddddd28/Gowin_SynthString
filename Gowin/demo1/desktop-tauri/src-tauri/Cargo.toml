[package]
name = "tang-synth-studio"
version = "0.4.0"
description = "Tang Mega 60K synthesizer studio"
edition = "2024"
default-run = "tang-synth-studio"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"
serialport = "4.10"
midir = "0.11"
sha2 = "0.10"
crc32fast = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media_Audio"] }

[features]
test-harness = []

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "studio-test-harness"
path = "src/bin/test_harness.rs"
required-features = ["test-harness"]

[profile.release]
strip = true
opt-level = "s"
